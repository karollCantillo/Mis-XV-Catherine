<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Invitación · Mis XV Catherine</title>
    <meta name="theme-color" content="#38131a">
 
    <!-- Open Graph / WhatsApp Preview -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Mis XV · Catherine 🌹">
    <meta property="og:description" content="Has sido invitado a celebrar esta noche tan especial. ¡Haz clic aquí para ver tu invitación!">
    
 
    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Josefin+Sans:ital,wght@0,300;0,400;0,600;1,400&family=Limelight&family=Poiret+One&display=swap" rel="stylesheet">
    
    <!-- Hoja de Estilos Externa -->
    <link rel="stylesheet" href="sello.css">
</head>
<body class="sello-page">
 
    <!-- La música empieza al tocar el sello y continúa en invitacion.html -->
    <audio id="bgm" src="musica.mp3" loop preload="auto"></audio>
 
    <div class="invitation-container">
        <!-- Sello de Cera 3D interactivo -->
        <div class="wax-seal-wrapper">
            <a href="invitacion.html" class="wax-seal" id="openSeal" aria-label="Abrir invitación">
                <span>C</span>
            </a>
        </div>
 
        <!-- Contenido de la tarjeta -->
        <p class="inv-eyebrow">Estás invitado a celebrar</p>
        
        <div class="inv-subtitle-line">Mis XV Años</div>
        <h1 class="inv-name">Catherine</h1>
 
        <p class="inv-for" id="invFor" hidden>Invitación para<strong id="guestName"></strong></p>
 
        <div class="inv-date-single">
            <p>14 de Noviembre · 2026</p>
        </div>
 
        <p class="inv-footer-text">Toca el sello de cera para abrir la invitación</p>
    </div>
 
    <script src="sello.js"></script>
</body>
</html>
